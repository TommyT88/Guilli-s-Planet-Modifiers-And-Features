 ap_archaeoengineers_tooltip:0 "\nUnlocks additional effects for §YAncient§! ship components and buildings.\n\nIncreases the chance of finding §Yrare rewards§! and discoveries from §YPrecursor§! dig sites."
 #building_archaeostudies_faculty_relic_effect:0 "If built on a §YRelic World§!:\n Research Speed (Archaeostudies): §G+50%§!\n £minor_artifacts£ Minor Artifacts from £job_researcher£ Archaeoengineers: §G+0.3§!\nIf built on an §YAncient Archaeopolis World§!:\n Research Speed (Archaeostudies): §G+100%§!\n £minor_artifacts£ Minor Artifacts from £job_researcher£ Archaeoengineers: §G+0.6§!"

 concept_terraforming_desc: "§H$concept_terraforming$§! is the process of transforming an £planet£ ['concept_planet'] within the borders of an ['concept_empire'] into something more habitable.\n\nThis typically requires specific ['concept_technologies'] and a significant investment of £energy£ ['concept_energy'].\n\nWith advanced §H$concept_technologies$§!, even inhabited planets can be terraformed to better suit the preferred climates of the ['concept_species'] living there.\n\n§H$concept_terraforming$§! a world will clear ['concept_planet_modifiers'] where they no longer make sense to be on the world and generate new planet modifiers.\n\nThe Terraforming ['concept_policy'] unlocked later in the game allows you to customise terraforming."

 allow_gaia:0 " - Allows us to terraform worlds into §YGaia Planets§!.\n - Allows us to gain §G+1§! new terraforming planet modifier on terraformed worlds with the §YGuided Terraforming Policy§!."